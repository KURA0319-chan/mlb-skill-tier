<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>MLB 勁旅對決 - 技能天梯與球卡畢業診斷</title>
  <style>
:root{--bg:#090d16;--panel:#121929;--panel2:#182138;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--text:#eef2f8;--sub:#a3aec2;--mute:#6f7b91;--accent:#f4b942;--ink:#241a05;--hard:#ff7088;--soft:#34d399;--warn:#fbbf24;--nav:62px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(900px 400px at 50% -140px,rgba(244,185,66,.11),transparent 70%),var(--bg);background-attachment:fixed;overflow-wrap:break-word;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select{font:inherit;color:var(--text);width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .15s,box-shadow .15s}
select{text-overflow:ellipsis}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(244,185,66,.18)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-tier="S+"]{--tc:#ff5d7a}[data-tier="S"]{--tc:#ff9b3d}[data-tier="A+"]{--tc:#b983ff}[data-tier="A"]{--tc:#7b8cff}[data-tier="B+"]{--tc:#3ccfd4}[data-tier="B"]{--tc:#58a0ff}[data-tier="C"]{--tc:#8e99ad}[data-tier="D"]{--tc:#5d677a}
.tier{display:inline-grid;place-items:center;min-width:40px;height:28px;padding:0 8px;border-radius:8px;font-weight:800;font-size:13px;color:var(--tc);background:color-mix(in srgb,var(--tc) 16%,transparent);border:1px solid color-mix(in srgb,var(--tc) 50%,transparent)}
.tier[data-tier="S+"]{box-shadow:0 0 14px color-mix(in srgb,var(--tc) 35%,transparent)}
/* 頂欄 */
.top{position:sticky;top:0;z-index:30;background:rgba(9,13,22,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#f4b942,#e8873a);font-size:19px;flex:none}
.brand h1{margin:0;font-size:16px;line-height:1.25;font-weight:800}
.brand p{margin:0;font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:10px;color:var(--sub);font-weight:700;font-size:14px;transition:.15s}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{color:var(--text)}.tab[aria-selected=true]{background:var(--accent);color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px}
.pane{display:none}.pane.on{display:block}
/* 天梯 */
.rank{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.filters{position:sticky;top:84px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.search{position:relative}.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute)}
.search input{padding-left:40px;padding-right:38px}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;color:var(--sub);display:none}
.search.has .clear{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.seg-btn{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);font-size:13.5px;font-weight:700;white-space:nowrap;transition:.15s}
.chip:hover,.seg-btn:hover{color:var(--text);border-color:var(--line2)}
.chip.on,.seg-btn.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.chip small{opacity:.7;font-weight:600;margin-left:3px}
.adv-btn{display:none;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;color:var(--sub)}
.adv{display:flex;flex-direction:column;gap:14px}
.f label,.lbl{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;letter-spacing:.3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-btn{border-radius:10px;padding:8px 13px}
.reset{font-size:13px;color:var(--accent);font-weight:700;text-align:left}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 12px;color:var(--sub);font-size:13px}
.list{display:flex;flex-direction:column;gap:12px}
.skill{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:16px;padding:14px 16px 15px;transition:border-color .15s,transform .15s}
@media(hover:hover){.skill:hover{border-color:var(--line2);border-left-color:var(--tc);transform:translateY(-1px)}}
.sk-top{display:flex;align-items:center;gap:12px}
.rk{width:26px;flex:none;text-align:center;color:var(--mute);font-weight:800;font-size:13px}
.sk-name{flex:1;min-width:0}.sk-name h3{margin:0;font-size:17px;line-height:1.35;font-weight:800}
.tags{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;border:1px solid var(--line2);color:var(--sub)}
.cat-HOF{background:linear-gradient(135deg,#7c2d12,#c2410c);color:#ffedd5;border-color:#fb923c}.cat-Moment{background:#064e3b;color:#a7f3d0;border-color:#10b981}.cat-Gold{background:#4a3408;color:#fde68a;border-color:#eab308}.cat-Silver{background:#2b3547;color:#e2e8f0;border-color:#94a3b8}.cat-Bronze{background:#3b1d08;color:#fdba74;border-color:#d97706}.cat-Iron{background:#1a2233;color:#94a3b8;border-color:#475569}
.sc{text-align:right;flex:none;line-height:1}.sc b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.sc small{font-size:12px;color:var(--sub);margin-left:2px}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.07);margin:12px 0 0 38px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--tc)}
.sk-body{margin-left:38px}
.note{margin-top:10px;font-size:12.5px;font-weight:700}.note.bonus{color:var(--soft)}.note.soft{color:var(--warn)}.note.penalty{color:var(--hard)}
.rules{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:10px}
.rule-hard,.rule-soft{font-size:12.5px;padding:3px 10px;border-radius:8px;line-height:1.5}
.rule-hard{background:rgba(255,112,136,.12);color:#ffb3c0;border:1px solid rgba(255,112,136,.4);font-weight:700}
.rule-soft{background:rgba(52,211,153,.1);color:#86efc4;border:1px solid rgba(52,211,153,.35)}
.desc{margin:10px 0 0;color:var(--sub);font-size:14px;line-height:1.7}
.empty{text-align:center;color:var(--sub);padding:56px 20px;background:var(--panel);border:1px dashed var(--line2);border-radius:16px;line-height:1.8}
/* 診斷 */
.eval{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:24px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:15px;font-weight:800;display:flex;gap:8px;align-items:center}
.card h2 span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:12px}
.hint{font-size:12.5px;color:var(--mute);margin:7px 0 0}
.g{margin-bottom:14px}.g:last-child{margin-bottom:0}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.slot:last-child{margin-bottom:0}
.slot-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.slot-h b{font-size:14px}.slot-h small{display:block;color:var(--mute);font-size:12px;font-weight:500}
.slot-h .r{display:flex;align-items:center;gap:8px;font-weight:800;font-variant-numeric:tabular-nums}
.slot select{margin-bottom:10px;background:var(--bg)}
.slot .seg{flex-wrap:nowrap}.slot .seg-btn{flex:1;padding:7px 0;text-align:center}
.report{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin}
.hero{--hc:#8e99ad;border-radius:18px;padding:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--hc) 20%,var(--panel)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--hc) 55%,transparent);margin-bottom:14px;transition:.25s}
.hero[data-state=god]{--hc:#f4b942}.hero[data-state=grad]{--hc:#34d399}.hero[data-state=pass]{--hc:#fbbf24}.hero[data-state=reroll]{--hc:#8e99ad}.hero[data-state=conflict],.hero[data-state=invalid]{--hc:#ff7088}
.hero-top{display:flex;align-items:center;gap:12px}.ico{font-size:34px;line-height:1}
.hero-t{flex:1;min-width:0}.hero-t b{display:block;font-size:19px;line-height:1.3}.hero-t small{color:var(--sub);font-size:12px}
.hero .sc b{font-size:38px;color:var(--hc)}
.meter{position:relative;height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin:16px 0 6px}
.meter i{display:block;height:100%;border-radius:8px;background:var(--hc);transition:width .35s}
.meter em{position:absolute;top:-3px;width:2px;height:14px;margin-left:-1px;background:rgba(255,255,255,.4);border-radius:2px}
.meter-l{position:relative;height:36px;font-size:11.5px;color:var(--mute)}.meter-l span{position:absolute;top:0;transform:translateX(-50%);text-align:center;line-height:1.3;white-space:nowrap}.meter-l span b{display:block;font-size:13px;color:var(--sub)}.meter-l span.hit,.meter-l span.hit b{color:var(--hc)}.meter em.hit{background:var(--text)}
.vsub{margin:12px 0 0;color:var(--sub);font-size:13.5px;line-height:1.65}
.item{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.item[data-k=warn]{border-left-color:var(--hard);background:rgba(255,112,136,.07)}.item[data-k=caution]{border-left-color:var(--warn);background:rgba(251,191,36,.07)}.item[data-k=good]{border-left-color:var(--soft);background:rgba(52,211,153,.06)}
.item-top{display:flex;align-items:center;gap:10px}.item-top .n{flex:1;min-width:0}.item-top b{display:block;line-height:1.35}.item-top small{color:var(--mute);font-size:12px}
.item-top .v{font-weight:800;font-variant-numeric:tabular-nums}
.status{margin-top:8px;font-size:12.5px;font-weight:700}.status[data-k=warn]{color:var(--hard)}.status[data-k=caution]{color:var(--warn)}.status[data-k=good]{color:var(--soft)}
.mini{display:none}
/* 底部導覽 / 其他 */
.bnav{display:none}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;place-items:center;z-index:25}
.fab.show{display:grid}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:22px 0 4px}
@media(max-width:1000px){
 .rank,.eval{grid-template-columns:minmax(0,1fr);gap:14px}
 .filters{position:static;padding:12px;gap:10px}
 .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px;padding:2px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
 .adv-btn{display:flex}.adv{display:none}.filters.open .adv{display:flex}
 .report{position:static;max-height:none;overflow:visible}
 .top .tabs{display:none}
 .bnav{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(12,17,29,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));min-height:var(--nav)}
 .bnav .tab{flex-direction:column;gap:2px;font-size:12px;padding:6px;border-radius:12px;justify-content:center}
 .bnav .tab[aria-selected=true]{background:none;color:var(--accent)}
 body[data-tab=evaluator] .mini{display:flex;position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 8px);z-index:35;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(24,33,56,.96);border:1px solid var(--line2);box-shadow:0 8px 28px rgba(0,0,0,.5);text-align:left}
 .mini b{flex:1;min-width:0;font-size:14px;line-height:1.3}.mini span{font-weight:800;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
 body[data-tab=evaluator]{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 86px)}
 body[data-tab=evaluator] .fab{bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 84px)}
}
@media(max-width:600px){
 .wrap{padding:12px 10px}.top-in{padding:8px 12px}.brand p{display:none}.brand h1{font-size:15px}
 input,select{font-size:16px}
 .skill{padding:13px 13px 14px}.rk{display:none}.bar,.sk-body{margin-left:0}.sc b{font-size:23px}.hero .sc b{font-size:32px}
 .card{padding:14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body data-tab="ranking">
<header class="top"><div class="top-in">
  <div class="brand"><div class="logo">⚾</div><div><h1>勁旅對決・技能天梯</h1><p><span id="cnt-total">198</span> 招全技能核心有效點數與球卡畢業診斷</p></div></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="ranking" aria-selected="true" onclick="switchTab('ranking')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>技能天梯</button>
    <button class="tab" role="tab" data-tab="evaluator" aria-selected="false" onclick="switchTab('evaluator')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m9 12 2 2 4-4"/></svg>球卡診斷</button>
  </div>
</div></header>

<main class="wrap">
<section id="pane-ranking" class="pane on"><div class="rank">
  <aside class="filters" id="filters">
    <div class="search" id="searchBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="searchInput" placeholder="搜尋技能名稱或效果，例如：客場、凝聚力" autocomplete="off" oninput="onSearch()"><button type="button" class="clear" aria-label="清除搜尋" onclick="clearSearch()">✕</button></div>
    <div class="chips" id="catChips">
      <button class="chip on" data-cat="ALL">全部<small id="cnt-all">198</small></button>
      <button class="chip" data-cat="HOF">HOF 黑技<small id="cnt-hof">49</small></button>
      <button class="chip" data-cat="Moment">Moment 綠技<small id="cnt-moment">44</small></button>
      <button class="chip" data-cat="GENERAL">一般技能</button>
      <button class="chip" data-cat="Gold">黃金<small id="cnt-gold">76</small></button>
      <button class="chip" data-cat="Silver">白銀<small id="cnt-silver">9</small></button>
      <button class="chip" data-cat="Bronze">青銅/鋼鐵<small id="cnt-bronze">20</small></button>
    </div>
    <button type="button" class="adv-btn" onclick="document.getElementById('filters').classList.toggle('open')"><span>進階篩選 <b id="advCount"></b></span><span>▾</span></button>
    <div class="adv">
      <div class="f"><label>投打分類</label><div class="seg" id="segType" data-for="typeFilter"></div><input type="hidden" id="typeFilter" value="ALL"></div>
      <div class="f"><label>守位 / 投手輪值</label><select id="posFilter" onchange="renderRanking()">
        <option value="ALL">不限守位 (顯示滿載點數)</option>
        <optgroup label="野手守位"><option value="C">C 捕手</option><option value="1B">1B 一壘</option><option value="2B">2B 二壘</option><option value="3B">3B 三壘</option><option value="SS">SS 游擊</option><option value="LF">LF 左外野</option><option value="CF">CF 中外野</option><option value="RF">RF 右外野</option><option value="DH">DH 指定打擊</option></optgroup>
        <optgroup label="投手輪值"><option value="SP1">SP1 第 1 號先發</option><option value="SP2">SP2 第 2 號先發</option><option value="SP34">SP3~4 第 3、4 號先發</option><option value="SP5">SP5 第 5 號先發</option><option value="RP12">RP1~2 中繼 1、2 號</option><option value="RP345">RP3~5 中繼 3、4、5 號</option><option value="CP">CP 終結者</option></optgroup></select></div>
      <div class="f"><label>打序棒次</label><select id="batOrderFilter" onchange="renderRanking()"><option value="ALL">不限棒次</option><option value="1">第 1 棒</option><option value="2">第 2 棒</option><option value="3">第 3 棒</option><option value="4">第 4 棒</option><option value="5">第 5 棒</option><option value="6">第 6~9 棒</option></select></div>
      <div class="f"><label>技能等級</label><div class="seg" id="segLvlF" data-for="lvlFilter"></div><input type="hidden" id="lvlFilter" value="1.00"></div>
      <button type="button" class="reset" id="resetBtn" onclick="resetFilters()" hidden>↺ 重設所有篩選</button>
    </div>
  </aside>
  <div><div class="meta"><span id="resultCount"></span><span>依有效點數由高到低</span></div><div class="list" id="rankingList"></div></div>
</div></section>

<section id="pane-evaluator" class="pane"><div class="eval">
  <div>
    <div class="card"><h2><span>1</span>設定球員</h2>
      <div class="g"><label class="lbl">卡片種類</label><div class="seg" id="segCard" data-for="evalCardType"></div><input type="hidden" id="evalCardType" value="SIG"><p class="hint" id="cardHint"></p></div>
      <div class="g"><label class="lbl">投打身份</label><div class="seg" id="segRole" data-for="evalPlayerRole"></div><input type="hidden" id="evalPlayerRole" value="打者"></div>
      <div class="g"><label class="lbl">守位 / 輪值</label><div class="seg" id="segPos" data-for="evalPos"></div><input type="hidden" id="evalPos" value="C"><p class="hint" id="posHint"></p></div>
      <div class="g" id="evalBatOrderGroup"><label class="lbl">打序棒次</label><div class="seg" id="segOrder" data-for="evalBatOrder"></div><input type="hidden" id="evalBatOrder" value="3"></div>
    </div>
    <div class="card"><h2><span>2</span>選擇 3 個技能</h2>
      <div class="slot"><div class="slot-h"><div><b>第 1 格</b><small id="slot1Hint"></small></div><div class="r" id="slot1ScoreText"></div></div><select id="slot1Skill" onchange="evaluateCard()"></select><div class="seg" id="segLvl1" data-for="slot1Lvl"></div><input type="hidden" id="slot1Lvl" value="1.00"></div>
      <div class="slot"><div class="slot-h"><div><b>第 2 格</b><small id="slot2Hint"></small></div><div class="r" id="slot2ScoreText"></div></div><select id="slot2Skill" onchange="evaluateCard()"></select><div class="seg" id="segLvl2" data-for="slot2Lvl"></div><input type="hidden" id="slot2Lvl" value="1.00"></div>
      <div class="slot"><div class="slot-h"><div><b>第 3 格</b><small id="slot3Hint"></small></div><div class="r" id="slot3ScoreText"></div></div><select id="slot3Skill" onchange="evaluateCard()"></select><div class="seg" id="segLvl3" data-for="slot3Lvl"></div><input type="hidden" id="slot3Lvl" value="1.00"></div>
    </div>
  </div>
  <div class="report" id="reportBox">
    <div class="hero" id="reportHeaderBox" data-state="reroll">
      <div class="hero-top"><div class="ico" id="verdictIco">🃏</div><div class="hero-t"><b id="verdictTitle">請選擇技能</b><small id="baseScoreDisplay"></small></div><div class="sc"><b id="totalScoreDisplay">0.0</b><small>點</small></div></div>
      <div class="meter"><i id="meterFill" style="width:0"></i><em id="tickPass"></em><em id="tickGrad"></em><em id="tickGod"></em></div>
      <div class="meter-l" id="meterLabels"></div>
      <p class="vsub" id="verdictSub"></p>
    </div>
    <div id="aiAnalysisList"></div>

const ORDER_ADJUST = {

    { when: ["6"], score: 27.0, type: "bonus", note: "★ 完美工具人棒次：單兵17點＋全隊光環加權達 27.0 點！" },

  ]
};

function matchesWhen(when, key) {
  if (Array.isArray(when)) return when.includes(key);
  if (when === "starter") return STARTER_POSITIONS.includes(key);
  if (when === "reliever") return RELIEVER_POSITIONS.includes(key);
  return when === key;
}

function addNote(state, type, note) {
  state.notes.push(note);
  if (type === "penalty") state.hasPenalty = true;
  else if (type === "soft") state.hasSoft = true;
  else if (type === "bonus") state.hasBonus = true;
}

function applyAdjust(state, rules, key) {
  if (!rules) return;
  const hit = rules.find(r => matchesWhen(r.when, key));
  if (!hit) return;
  if (hit.score !== undefined) state.score = hit.score;
  addNote(state, hit.type, hit.note);
}

function readableOrders(orderRule) {
  // 資料庫的 6789 在介面上合併成「第 6~9 棒」，所以只列出 1~6
  return orderRule.split("").filter(d => Number(d) <= 6).map(d => d === "6" ? "6~9" : d).join("/");
}

// ==================== 動態計分引擎：完全對應有效點數折算 ====================
function computeDynamicScore(skill, pos, batOrder, lvlMult) {
  const state = { score: skill.baseScore, notes: [], hasPenalty: false, hasSoft: false, hasBonus: false };

  if (pos !== "ALL") {
    const isPitcherPos = PITCHER_POSITIONS.includes(pos);
    if (isPitcherPos !== (skill.type === "投手")) return null;

    const rule = POS_RULES[skill.posRule];
    if (rule) {
      if (rule.ok(pos)) {
        addNote(state, "bonus", rule.okNote);
      } else {
        // 違規只會扣分，不會加分：退化點數取「資料庫指定值」與「原點數」中較小者
        state.score = skill.posFallback !== undefined
          ? Math.min(skill.posFallback, state.score)
          : state.score * (rule.defaultMult !== undefined ? rule.defaultMult : DEFAULT_POS_PENALTY_MULT);
        addNote(state, "penalty", `${rule.badNote} (退化為 ${state.score.toFixed(1)} 點)`);
      }
    }
    if (isPitcherPos) applyAdjust(state, ROLE_ADJUST[skill.name], pos);
  }

  if (batOrder !== "ALL" && skill.type === "打者") {
    applyAdjust(state, ORDER_ADJUST[skill.name], batOrder);
    if (skill.orderRule !== "ANY") {
      if (skill.orderRule.includes(batOrder)) {
        addNote(state, "bonus", "★ 符合專屬棒次條件 (滿載點數)");
      } else {
        if (skill.orderLoss !== undefined) state.score = Math.max(0, state.score - skill.orderLoss);
        else if (skill.orderFallback !== undefined) state.score = Math.min(state.score, skill.orderFallback);
        else state.score *= DEFAULT_ORDER_PENALTY_MULT;
        addNote(state, "penalty", `❌ 違反硬性棒次：需放第 ${readableOrders(skill.orderRule)} 棒才生效 (退化為 ${state.score.toFixed(1)} 點)`);
      }
    }
  }

  const noteType = state.hasPenalty ? "penalty" : (state.hasSoft ? "soft" : (state.hasBonus ? "bonus" : ""));
  return { finalScore: state.score * lvlMult, note: state.notes.join(" ｜ "), noteType };
}

// ==================== 統一核心有效點數 Tier 門檻 ====================
function getSkillTier(skill, currentScore, lvlMult) {
  const normScore = currentScore / lvlMult;
  if (skill.cat === "HOF") {
    if (normScore >= 31.0) return "S+";
    if (normScore >= 26.0) return "S";
    if (normScore >= 20.0) return "A+";
    if (normScore >= 16.0) return "A";
    if (normScore >= 13.0) return "B+";
    if (normScore >= 11.0) return "B";
    return "C";
  } else if (skill.cat === "Moment") {
    if (normScore >= 26.0) return "S+";
    if (normScore >= 20.0) return "S";
    if (normScore >= 17.5) return "A+";
    if (normScore >= 15.0) return "A";
    if (normScore >= 12.0) return "B+";
    if (normScore >= 9.0) return "B";
    return "C";
  } else {
    if (normScore >= 15.5) return "S+";
    if (normScore >= 13.0) return "S";
    if (normScore >= 11.5) return "A+";
    if (normScore >= 10.5) return "A";
    if (normScore >= 8.5) return "B+";
    if (normScore >= 7.5) return "B";
    if (normScore >= 4.5) return "C";
    return "D";
  }
}

function getTierBadgeClass(tier) {
  if (tier === "S+") return "tier-S-plus";
  if (tier === "A+") return "tier-A-plus";
  if (tier === "B+") return "tier-B-plus";
  return `tier-${tier}`;
}

// ---------- 分段按鈕 (取代下拉選單，手機單手好點) ----------
function syncSeg(id) {
  const el = $(id), v = $(el.dataset.for).value;
  el.querySelectorAll('.seg-btn').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
}
function buildSeg(id, options, onChange) {
  const el = $(id);
  el.setAttribute('role', 'radiogroup');
  el.innerHTML = options.map(o => `<button type="button" class="seg-btn" role="radio" data-v="${o.v}">${o.t}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('.seg-btn'); if (!b) return; $(el.dataset.for).value = b.dataset.v; syncSeg(id); if (onChange) onChange(b.dataset.v); };
  syncSeg(id);
}

function renderRanking() {
  const search = $('searchInput').value.trim().toLowerCase();
  const typeF = $('typeFilter').value, posF = $('posFilter').value, orderF = $('batOrderFilter').value;
  const lvlMult = parseFloat($('lvlFilter').value);

  const advN = [typeF !== 'ALL', posF !== 'ALL', orderF !== 'ALL', lvlMult !== 1].filter(Boolean).length;
  $('advCount').textContent = advN ? `· 已套用 ${advN} 項` : '';
  $('resetBtn').hidden = !(advN || search || currentQuickCat !== 'ALL');

  let list = [];
  skillsDB.forEach(s => {
    if (currentQuickCat === "HOF" && s.cat !== "HOF") return;
    if (currentQuickCat === "Moment" && s.cat !== "Moment") return;
    if (currentQuickCat === "GENERAL" && (s.cat === "HOF" || s.cat === "Moment")) return;
    if (currentQuickCat === "Gold" && s.cat !== "Gold") return;
    if (currentQuickCat === "Silver" && s.cat !== "Silver") return;
    if (currentQuickCat === "Bronze" && s.cat !== "Bronze" && s.cat !== "Iron") return;
    if (typeF !== "ALL" && s.type !== typeF) return;
    if (search && ![s.name, s.desc, s.hardRuleText, s.softRecText].some(t => (t || '').toLowerCase().includes(search))) return;
    const calc = computeDynamicScore(s, posF, orderF, lvlMult);
    if (!calc) return;
    list.push({ ...s, currentScore: calc.finalScore, note: calc.note, noteType: calc.noteType, tier: getSkillTier(s, calc.finalScore, lvlMult) });
  });
  list.sort((a, b) => (b.currentScore - a.currentScore) || a.name.localeCompare(b.name, 'zh-Hant'));
  $('resultCount').textContent = `共 ${list.length} 個技能`;

  const box = $('rankingList');
  if (!list.length) {
    const isP = PITCHER_POSITIONS.includes(posF);
    const conflict = posF !== "ALL" && typeF !== "ALL" && ((isP && typeF === "打者") || (!isP && typeF === "投手"));
    box.innerHTML = `<div class="empty">🔍<br>${conflict ? "「投打分類」和「守位 / 輪值」互相衝突：投手輪值只會有投手技能，野手守位只會有打者技能。<br>請改成一致，或把其中一個設回「全部」。" : "沒有符合條件的技能。<br>試著清除搜尋字，或放寬篩選條件。"}</div>`;
    return;
  }
  const max = Math.max(...list.map(s => s.currentScore), 1);
  box.innerHTML = list.map((s, i) => `
    <article class="skill" data-tier="${s.tier}">
      <div class="sk-top"><span class="rk">${i + 1}</span><span class="tier" data-tier="${s.tier}">${s.tier}</span>
        <div class="sk-name"><h3>${s.name}</h3><div class="tags"><span class="tag cat-${s.cat}">${s.cat}</span><span class="tag">${s.type}</span></div></div>
        <div class="sc"><b>${s.currentScore.toFixed(1)}</b><small>點</small></div></div>
      <div class="bar"><i style="width:${Math.max(3, s.currentScore / max * 100).toFixed(1)}%"></i></div>
      <div class="sk-body">
        ${s.note ? `<div class="note ${s.noteType || 'penalty'}">${s.note}</div>` : ''}
        ${(s.hardRuleText || s.softRecText) ? `<div class="rules">${s.hardRuleText ? `<span class="rule-hard">${s.hardRuleText}</span>` : ''}${s.softRecText ? `<span class="rule-soft">${s.softRecText}</span>` : ''}</div>` : ''}
        <p class="desc">${s.desc}</p>
      </div>
    </article>`).join('');
}

function updateEvaluatorPools() {
  const cardType = $('evalCardType').value, role = $('evalPlayerRole').value;
  const posList = role === "打者" ? BAT_POS : PIT_POS;
  $('evalPos').value = posList[0][0];
  buildSeg('segPos', posList.map(p => ({ v: p[0], t: p[1] })), evaluateCard);
  $('evalBatOrderGroup').style.display = role === "打者" ? "block" : "none";
  $('cardHint').textContent = CARD_HINTS[cardType];

  const normal = ["Gold", "Silver", "Bronze", "Iron"];
  const hints = { SIG: ["一般池", "一般池", "一般池"], MOMENT: ["可選專屬綠技或一般技", "一般池", "一般池"], HOF: ["可選黑技或一般技", "可選黑技或一般技", "可選黑技或一般技"] }[cardType];
  hints.forEach((h, i) => $(`slot${i + 1}Hint`).textContent = h);
  if (cardType === "SIG") {
    [0, 1, 2].forEach(i => populateSkillSelect(`slot${i + 1}Skill`, role, normal, i));
  } else if (cardType === "MOMENT") {
    populateSkillSelect('slot1Skill', role, ["Moment", ...normal], 0);
    populateSkillSelect('slot2Skill', role, normal, 0);
    populateSkillSelect('slot3Skill', role, normal, 1);
  } else {
    const all = ["HOF", ...normal];
    populateSkillSelect('slot1Skill', role, all, 0);
    populateSkillSelect('slot2Skill', role, all, 1);
    populateSkillSelect('slot3Skill', role, all, 0, "Gold");
  }
  evaluateCard();
}

function populateSkillSelect(selectId, role, allowedCats, defaultIdx, defaultCat) {
  const sel = document.getElementById(selectId);
  sel.innerHTML = "";
  const pool = skillsDB.filter(s => s.type === role && allowedCats.includes(s.cat));
  const catLabels = { HOF: "🟧 HOF 名人堂黑技", Moment: "💚 Moment 專屬綠技", Gold: "🥇 黃金段位技能", Silver: "🥈 白銀段位技能", Bronze: "🥉 青銅段位技能", Iron: "🔩 鋼鐵段位技能" };

  allowedCats.forEach(cat => {
    const subList = pool.filter(s => s.cat === cat).sort((a, b) => b.baseScore - a.baseScore);
    if (subList.length > 0) {
      const grp = document.createElement('optgroup');
      grp.label = catLabels[cat];
      subList.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.dataset.cat = s.cat;
        const tierStr = getSkillTier(s, s.baseScore, 1.0);
        const ruleTag = s.hardRuleText ? ` [${s.hardRuleText.replace('🔴 硬性限定：', '限:')}]` : "";
        opt.textContent = `[${tierStr}] ${s.name} (${s.baseScore}點)${ruleTag}`;
        grp.appendChild(opt);
      });
      sel.appendChild(grp);
    }
  });

  let idx = defaultIdx;
  if (defaultCat) {
    const found = Array.from(sel.options).findIndex(o => o.dataset.cat === defaultCat);
    if (found >= 0) idx = found;
  }
  sel.selectedIndex = sel.options.length > idx ? idx : 0;
}

function syncSlotOptions() {
  const ids = ['slot1Skill', 'slot2Skill', 'slot3Skill'];
  const chosen = ids.map(id => document.getElementById(id).value);
  ids.forEach((id, i) => {
    Array.from(document.getElementById(id).options).forEach(opt => {
      opt.disabled = chosen.some((v, j) => j !== i && v === opt.value);
    });
  });
}


function evaluateCard() {
  syncSlotOptions();
  const cardType = $('evalCardType').value, role = $('evalPlayerRole').value, pos = $('evalPos').value;
  const order = role === "打者" ? $('evalBatOrder').value : "ALL";
  const posMeta = (role === "打者" ? BAT_POS : PIT_POS).find(p => p[0] === pos);
  $('posHint').textContent = posMeta ? posMeta[2] : "";

  const slots = [1, 2, 3].map(n => ({ name: $(`slot${n}Skill`).value, mult: parseFloat($(`slot${n}Lvl`).value), el: `slot${n}ScoreText` }));
  let totalScore = 0, baseTotal = 0, hasHardConflict = false, html = "";

  const hasDuplicate = slots.some((s, i) => slots.findIndex(o => o.name === s.name) !== i);
  if (hasDuplicate) html += `<div class="item" data-k="warn"><b>同一個技能被重複選在多格，請改選不同技能。</b></div>`;

  slots.forEach((slot, i) => {
    const sk = skillsDB.find(s => s.name === slot.name);
    if (!sk) { $(slot.el).textContent = "—"; return; }
    const calc = computeDynamicScore(sk, pos, order, slot.mult);
    const sScore = calc ? calc.finalScore : 0;
    totalScore += sScore; baseTotal += calc ? sScore / slot.mult : 0;
    const tier = getSkillTier(sk, sScore, slot.mult);
    $(slot.el).innerHTML = `<span class="tier" data-tier="${tier}">${tier}</span>${sScore.toFixed(1)}`;

    let k = "", status = "";
    if (calc && calc.noteType === "penalty") { k = "warn"; hasHardConflict = true; status = calc.note; }
    else if (calc && calc.noteType === "soft") { k = "caution"; status = calc.note; }
    else if (WARN_SKILLS.includes(sk.name)) { k = "warn"; status = "⚠️ 彈道 / 球種 / 球數有限制，請詳閱實戰解析"; }
    else if (tier === "C" || tier === "D") { k = "warn"; status = `⚠️ 有效點數偏低 (${tier} 級)，建議優先重洗這一格`; }
    else if (calc && calc.noteType === "bonus") { k = "good"; status = calc.note; }

    html += `<div class="item" data-k="${k}">
      <div class="item-top"><span class="tier" data-tier="${tier}">${tier}</span><div class="n"><b>${sk.name}</b><small>第 ${i + 1} 格・${sk.cat}</small></div><span class="v">${sScore.toFixed(1)} 點</span></div>
      ${status ? `<div class="status" data-k="${k}">${status}</div>` : ''}
      ${(sk.hardRuleText || sk.softRecText) ? `<div class="rules">${sk.hardRuleText ? `<span class="rule-hard">${sk.hardRuleText}</span>` : ''}${sk.softRecText ? `<span class="rule-soft">${sk.softRecText}</span>` : ''}</div>` : ''}
      <p class="desc">${sk.desc}</p></div>`;
  });

  let t = { god: 46.0, grad: 39.0, pass: 30.0 };
  if (cardType === "MOMENT") t = { god: 58.0, grad: 48.0, pass: 38.0 };
  else if (cardType === "HOF") t = { god: 72.0, grad: 55.0, pass: 43.0 };

  const judge = VERDICT_USES_LEVEL ? totalScore : baseTotal;
  const jl = VERDICT_USES_LEVEL ? "有效點數" : "基準有效點數";
  const tail = hasHardConflict ? "　⚠️ 有技能放錯定位，已按退化後的點數計算（見下方紅框），建議確認陣容。" : "";
  const s1 = skillsDB.find(s => s.name === slots[0].name);
  const hasHof = slots.some(sl => (skillsDB.find(s => s.name === sl.name) || {}).cat === "HOF");

  let state, sub;
  if (hasDuplicate) { state = "invalid"; sub = "請在三格中各選不同的技能，才能正確計算。"; }
  else if (cardType === "MOMENT" && s1 && s1.cat !== "Moment") { state = "invalid"; sub = "Moment 卡的核心價值在第 1 格專屬綠技，請優先洗出 S / S+ 級綠技，再鎖定洗第 2、3 格。"; }
  else if (cardType === "HOF" && !hasHof) { state = "invalid"; sub = "名人堂卡至少要有 1～2 個 HOF 黑技才能發揮價值，建議繼續洗鍊。"; }
  else if (hasHardConflict && judge < t.grad) { state = "conflict"; sub = "紅框技能因放錯守位 / 輪值 / 棒次，或局數衰退而大幅損失點數（如消防員、終極王者放先發），請調整陣容或重洗。"; }
  else if (judge >= t.god) { state = "god"; sub = `${jl}達神卡門檻 ${t.god} 點。三技能皆為高覆蓋率神技，不用再花資源。${tail}`; }
  else if (judge >= t.grad) { state = "grad"; sub = `${jl}達畢業門檻 ${t.grad} 點。主技與副技搭配紮實，可以安心停手。${tail}`; }
  else if (judge >= t.pass) { state = "pass"; sub = `距離畢業門檻 ${t.grad} 點還差一點。有 1～2 個好技能撐著，第 3 格偏弱，可先上場，存夠鎖定券再升級最弱的一格。`; }
  else { state = "reroll"; sub = `${jl}未達過渡門檻 ${t.pass} 點，技能組有效點數過低或有條件陷阱，建議繼續洗鍊。`; }

  const [ico, name] = VERDICTS[state], span = t.god * 1.12;
  $('reportHeaderBox').dataset.state = state;
  $('verdictIco').textContent = ico; $('verdictTitle').textContent = name; $('verdictSub').textContent = sub;
  $('totalScoreDisplay').textContent = totalScore.toFixed(1);
  $('baseScoreDisplay').textContent = VERDICT_USES_LEVEL ? "判定已含技能等級加成" : `S 級基準 ${baseTotal.toFixed(1)} 點（判定依據）`;
  $('meterFill').style.width = Math.min(100, judge / span * 100) + "%";
  const names = { pass: "過渡", grad: "畢業", god: "神卡" };
  ["pass", "grad", "god"].forEach(k => {
    const el = $("tick" + k[0].toUpperCase() + k.slice(1));
    el.style.left = (t[k] / span * 100) + "%";
    el.classList.toggle("hit", judge >= t[k]);
  });
  $('meterLabels').innerHTML = ["pass", "grad", "god"].map(k => `<span class="${judge >= t[k] ? "hit" : ""}" style="left:${t[k] / span * 100}%">${names[k]}<b>${t[k]}</b></span>`).join("");
  $('aiAnalysisList').innerHTML = html;
  $('miniIco').textContent = ico; $('miniTitle').textContent = name; $('miniScore').textContent = totalScore.toFixed(1) + " 點";
}

function switchTab(id) {
  document.body.dataset.tab = id;
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + id));
  document.querySelectorAll('[data-tab].tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === id));
  window.scrollTo({ top: 0 });
}

function validateSkillDB() {
  skillsDB.forEach(s => ["posFallback", "orderFallback"].forEach(k => {
    if (s[k] !== undefined && s[k] > s.baseScore) console.warn(`[資料檢查] ${s.name} 的 ${k} (${s[k]}) 高於 baseScore (${s.baseScore})`);
  }));
}

window.onload = function () {
  validateSkillDB();
  updateCounts();
  document.querySelectorAll('#catChips .chip').forEach(c => c.onclick = () => setQuickCat(c.dataset.cat));
  buildSeg('segType', [{ v: "ALL", t: "全部" }, { v: "打者", t: "打者" }, { v: "投手", t: "投手" }], renderRanking);
  buildSeg('segLvlF', LEVELS, renderRanking);
  buildSeg('segCard', [{ v: "SIG", t: "一般卡" }, { v: "MOMENT", t: "Moment 卡" }, { v: "HOF", t: "HOF 名人堂卡" }], onPlayerConfigChange);
  buildSeg('segRole', [{ v: "打者", t: "打者" }, { v: "投手", t: "投手" }], onPlayerConfigChange);
  buildSeg('segOrder', [1, 2, 3, 4, 5].map(n => ({ v: String(n), t: `${n} 棒` })).concat([{ v: "6", t: "6~9 棒" }]), evaluateCard);
  [1, 2, 3].forEach(n => buildSeg(`segLvl${n}`, LEVELS, evaluateCard));
  renderRanking();
  updateEvaluatorPools();
  const fab = $('fab');
  window.addEventListener('scroll', () => fab.classList.toggle('show', window.scrollY > 700), { passive: true });
};
</script>
